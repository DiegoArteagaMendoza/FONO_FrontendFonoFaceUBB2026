<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fono Face UBB</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica el tema guardado ANTES de que Angular renderice, para evitar
    // el destello blanco al recargar la página en modo oscuro.
    (function () {
      try {
        var guardado = localStorage.getItem('tema');
        var tema = (guardado === 'claro' || guardado === 'oscuro')
          ? guardado
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
        document.documentElement.setAttribute('data-theme', tema);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'claro');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
