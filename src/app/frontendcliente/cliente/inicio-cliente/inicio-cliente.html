<div class="cliente-layout">
  <header class="hero-section">
    <div class="hero-content">
      <h1>Bienvenido a Fono Face UBB</h1>
      <p>Tu portal dedicado al cuidado vocal, salud y bienestar. Encuentra la información que necesitas, diseñada especialmente para ti.</p>
      <!-- <button class="btn-primary-hero" routerLink="/portal/informacion">Explorar Contenido</button> -->
    </div>
  </header>

  <main class="main-content">
    <section class="intro-section">
      <h2>¿Qué puedes encontrar aquí?</h2>
      <div class="features-grid">
        
        <div class="feature-card" *ngFor="let item of caracteristicas">
          <div class="icon-wrapper">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="item.icono"></path>
            </svg>
          </div>
          <h3>{{ item.titulo }}</h3>
          <p>{{ item.descripcion }}</p>
          <a [routerLink]="item.ruta" class="link-action">Ver más →</a>
        </div>

      </div>
    </section>

    <!-- <section class="cta-section">
      <div class="cta-box">
        <h3>¿Tienes dudas específicas?</h3>
        <p>Revisa nuestra sección de cuidados clasificada según tu perfil profesional o personal.</p>
        <a routerLink="/portal/cuidados" class="btn-outline">Ir a Cuidados</a>
      </div>
    </section> -->
  </main>
</div>
