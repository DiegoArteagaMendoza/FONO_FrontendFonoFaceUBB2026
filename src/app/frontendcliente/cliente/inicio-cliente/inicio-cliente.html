<div class="cliente-layout">

  <app-inicio-carrusel></app-inicio-carrusel>

  <main class="main-content">
    <section class="intro-section">
      <h2>{{ t().portal_inicio.seccion_titulo }}</h2>
      <div class="features-grid">

        <div class="feature-card" *ngFor="let item of caracteristicas">
          <div class="icon-wrapper">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="item.icono"></path>
            </svg>
          </div>
          <h3>{{ item.titulo }}</h3>
          <p>{{ item.descripcion }}</p>
          <a [routerLink]="item.ruta" class="link-action">{{ t().portal_inicio.ver_mas }}</a>
        </div>

      </div>
    </section>

    </main>
</div>
