@if (isOpen()) {
  <div 
    class="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden transition-opacity" 
    (click)="onClose()">
  </div>
}

<aside 
  class="fixed inset-y-0 left-0 z-50 w-64 bg-fonoPrimary text-white shadow-xl transform transition-transform duration-300 ease-in-out md:translate-x-0 md:static md:inset-0 md:h-full flex flex-col"
  [ngClass]="isOpen() ? 'translate-x-0' : '-translate-x-full'">
  
  <div class="flex items-center justify-between h-16 px-6 bg-sky-700">
    <span class="text-2xl font-bold tracking-wider">{{ t().globales.marca }}</span>
    <button class="md:hidden text-white hover:text-sky-200 focus:outline-none" (click)="onClose()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
    <!-- CORRECCIÓN AQUÍ: Iteramos sobre menuFiltrado() ejecutándolo como función -->
    @for (item of menuFiltrado(); track item.label) {
      
      @if (!item.children) {
        <a 
          [routerLink]="item.path" 
          routerLinkActive="bg-fonoSecondary text-white shadow-md font-semibold"
          [routerLinkActiveOptions]="{exact: true}"
          (click)="onClose()"
          class="flex items-center px-4 py-3 rounded-lg transition-all duration-200 hover:bg-sky-600 text-sky-100 hover:text-white">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
          </svg>
          <span>{{ item.label }}</span>
        </a>
      } 
      
      @else {
        <div class="space-y-1">
          <button 
            (click)="toggleMenu(item.label)"
            class="flex items-center justify-between w-full px-4 py-3 rounded-lg transition-all duration-200 hover:bg-sky-600 text-sky-100 hover:text-white focus:outline-none">
            <div class="flex items-center">
              <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
              </svg>
              <span>{{ item.label }}</span>
            </div>
            <svg class="w-4 h-4 transition-transform duration-200" 
                 [class.rotate-180]="expandedMenus[item.label]" 
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          
          @if (expandedMenus[item.label]) {
            <div class="pl-11 pr-4 py-1 space-y-1">
              @for (child of item.children; track child.path) {
                <a 
                  [routerLink]="child.path" 
                  routerLinkActive="bg-fonoSecondary text-white font-semibold"
                  [routerLinkActiveOptions]="{exact: true}"
                  (click)="onClose()"
                  class="block px-3 py-2 text-sm rounded-md transition-colors duration-200 hover:bg-sky-600 text-sky-200 hover:text-white">
                  {{ child.label }}
                </a>
              }
            </div>
          }
        </div>
      }
    }
  </nav>
  
  <div class="p-4 bg-sky-800">
    <button 
      (click)="cerrarSesion()" 
      class="flex items-center w-full px-4 py-2 text-sm text-sky-100 hover:text-white hover:bg-sky-700 rounded-lg transition-colors">
      <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      {{ t().globales.cerrar_sesion }}
    </button>
  </div>
</aside>
