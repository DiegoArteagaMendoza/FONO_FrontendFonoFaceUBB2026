<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Bienvenido a FonoFace</h2>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <div *ngIf="errorMessage" class="server-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="ejemplo@correo.com"
          [class.is-invalid]="email?.invalid && (email?.dirty || email?.touched)"
        >
        <div class="error-messages" *ngIf="email?.invalid && (email?.dirty || email?.touched)">
          <small *ngIf="email?.errors?.['required']">El correo es obligatorio.</small>
          <small *ngIf="email?.errors?.['email']">El formato del correo no es válido.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="********"
          [class.is-invalid]="password?.invalid && (password?.dirty || password?.touched)"
        >
        <div class="error-messages" *ngIf="password?.invalid && (password?.dirty || password?.touched)">
          <small *ngIf="password?.errors?.['required']">La contraseña es obligatoria.</small>
          <small *ngIf="password?.errors?.['minlength']">Debe tener al menos 6 caracteres.</small>
        </div>
      </div>

      <!-- <div class="form-group captcha-wrapper" style="display: flex; justify-content: center; margin-bottom: 1rem;">
        <re-captcha (resolved)="onCaptchaResolved($event)"></re-captcha>
      </div> -->

      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="isSubmitting">
        {{ isSubmitting ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
      <div class="login-header">
        <p>Para registrarse como usuario autorizado contacte con el administrador del sistema</p>
      </div>

    </form>
  </div>
</div>
