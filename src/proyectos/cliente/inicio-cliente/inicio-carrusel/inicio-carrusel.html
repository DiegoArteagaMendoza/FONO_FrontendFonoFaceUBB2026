<div class="carousel-container">
  
  <div class="carousel-slide" 
       *ngFor="let item of caracteristicas; let i = index" 
       [class.active]="i === currentIndex">
    
    <img [src]="obtenerUrlImagen(item)" [alt]="item.titulo" class="slide-image">
    
    <div class="slide-overlay">
      <div class="hero-content">
        <h3>{{ item.titulo }}</h3>
        <p>{{ item.descripcion }}</p>
      </div>
    </div>
    
  </div>

  <button class="nav-btn prev-btn" (click)="anterior()">&#10094;</button>
  <button class="nav-btn next-btn" (click)="siguiente()">&#10095;</button>

  <div class="carousel-indicators">
    <span class="dot" 
          *ngFor="let item of caracteristicas; let i = index" 
          [class.active]="i === currentIndex"
          (click)="irA(i)">
    </span>
  </div>
  
</div>
