<footer class="cliente-footer">
  <div class="footer-container">

    <div class="footer-grid">

      <!-- Sección 1: Marca -->
      <div class="footer-section">
        <span class="footer-brand">FonoFace</span>
        <p class="footer-description">
          {{ t().portal_footer.descripcion }}
        </p>
      </div>

      <!-- Sección 2: Enlaces Rápidos -->
      <div class="footer-section">
        <h3>{{ t().portal_footer.titulo_enlaces }}</h3>
        <ul class="footer-links">
          <li *ngFor="let enlace of t().portal_footer.enlaces">
            <a [routerLink]="enlace.path">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
              {{ enlace.label }}
            </a>
          </li>
        </ul>
      </div>

      <!-- Sección 3: Contacto -->
      <div class="footer-section">
        <h3>{{ t().portal_footer.titulo_contacto }}</h3>
        <div class="footer-contacto">
          <p>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            {{ t().portal_footer.contacto_email }}
          </p>
          <p>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            {{ t().portal_footer.contacto_direccion }}
          </p>
        </div>
      </div>

    </div>

    <!-- Copyright -->
    <div class="footer-bottom">
      <p>&copy; {{ anioActual }} {{ t().portal_footer.derechos }}</p>
    </div>

  </div>
</footer>
