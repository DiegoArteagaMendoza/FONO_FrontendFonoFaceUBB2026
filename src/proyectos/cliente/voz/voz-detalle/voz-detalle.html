<div class="detalle-page">

  <div class="nav-back">
    <button (click)="volver()" class="btn-back">
      {{ t().portal_voz_detalle.volver }}
    </button>
  </div>

  <div *ngIf="cargando" class="loading-state">
    <div class="spinner"></div>
    <p>{{ t().portal_voz_detalle.cargando }}</p>
  </div>

  <div *ngIf="errorMensaje" class="error-state">
    <p>{{ errorMensaje }}</p>
    <button (click)="volver()" class="btn-primary">{{ t().portal_voz_detalle.regresar }}</button>
  </div>

  <article class="article-content" *ngIf="!cargando && voz">

    <header class="article-header">
      <span class="category-badge" [ngClass]="getBadgeClass(voz.categoria)">
        {{ obtenerNombreCategoria(voz.categoria) }}
      </span>
      <h1>{{ voz.titulo }}</h1>
    </header>

    <div class="hero-image" *ngIf="voz.img">
      <img [src]="obtenerUrlImagen(voz.img)" alt="Imagen sobre la voz">
    </div>

    <div class="article-body">
      <div class="content-text">
        {{ voz.contenido }}
      </div>

      <div class="article-footer" *ngIf="voz.fuente">
        <hr>
        <p class="source-text"><strong>{{ t().portal_voz_detalle.fuente }}</strong> {{ voz.fuente }}</p>
      </div>
    </div>

  </article>
</div>
