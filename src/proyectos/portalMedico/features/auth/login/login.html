<div class="page-container flex items-center justify-center" style="min-height: calc(100vh - 4rem - 3.5rem);">
  <div class="form-card w-full" style="max-width: 460px;">

    <!-- ============ PESTAÑAS: PACIENTE / FONOAUDIÓLOGO ============ -->
    <div class="tabs-cuenta" role="tablist" [attr.aria-label]="t().pm_login_tabs.aria_selector">
      <button type="button" role="tab"
              [attr.aria-selected]="esPaciente"
              [class.activa]="esPaciente"
              (click)="cambiarTipo('paciente')">
        {{ t().pm_login_tabs.paciente }}
      </button>
      <button type="button" role="tab"
              [attr.aria-selected]="!esPaciente"
              [class.activa]="!esPaciente"
              (click)="cambiarTipo('profesional')">
        {{ t().pm_login_tabs.profesional }}
      </button>
    </div>

    <div class="text-center mb-6">
      <h2 class="text-xl font-bold m-0" style="color: var(--fono-texto);">{{ textos.titulo }}</h2>
      <p class="text-sm mt-1" style="color: var(--fono-texto-suave);">{{ textos.subtitulo }}</p>
    </div>

    <div *ngIf="avisoSesionExpirada" class="info-alert">{{ textos.aviso_sesion_expirada }}</div>
    <div *ngIf="errorMessage" class="error-alert">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="custom-form">
      <div class="form-group">
        <label for="identificador">{{ textos.label_identificador }}</label>
        <input
          id="identificador"
          type="text"
          formControlName="identificador"
          [placeholder]="textos.placeholder_identificador"
          [class.is-invalid]="identificador?.invalid && identificador?.touched"
        >
        <small class="error-text" *ngIf="identificador?.hasError('required') && identificador?.touched">
          {{ textos.alerta_identificador }}
        </small>
      </div>

      <div class="form-group">
        <label for="password">{{ textos.label_password }}</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          [placeholder]="textos.placeholder_password"
          [class.is-invalid]="password?.invalid && password?.touched"
        >
        <small class="error-text" *ngIf="password?.hasError('required') && password?.touched">
          {{ textos.alerta_password }}
        </small>
      </div>

      <button type="submit" class="btn-primary w-full" [disabled]="isSubmitting">
        {{ isSubmitting ? textos.btn_ingresando : textos.btn_ingresar }}
      </button>
    </form>

    <div class="text-center text-sm mt-4" style="color: var(--fono-texto-suave);">
      <p class="m-0">
        {{ t().pm_login_tabs.sin_cuenta }}
        <a [routerLink]="rutaRegistro" style="color: var(--fono-primario); font-weight: 600;">
          {{ esPaciente ? t().pm_login_tabs.registro_paciente : t().pm_login_tabs.registro_profesional }}
        </a>
      </p>
    </div>

  </div>
</div>
